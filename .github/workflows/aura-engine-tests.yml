name: AURA engine checks

on:
  push:
    branches:
      - 'feat/*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AURA engine syntax
        run: node --check aura-engine.mjs
      - name: Check AURA lab module syntax
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("aura-lab.html","utf8"); const match=html.match(/<script type="module">([\s\S]*?)<\/script>/i); if(!match) throw new Error("AURA lab module not found"); fs.writeFileSync("/tmp/aura-lab.mjs",match[1]);'
          node --check /tmp/aura-lab.mjs
      - name: Check main website AURA module syntax
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("index.html","utf8"); const scripts=[...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/gi)]; if(!scripts.length) throw new Error("Main AURA module not found"); fs.writeFileSync("/tmp/index-aura.mjs",scripts[scripts.length-1][1]);'
          node --check /tmp/index-aura.mjs
      - name: Check 3D spatial engine syntax
        run: |
          node --check spatial-math.mjs
          node --check spatial-world.mjs
      - name: Run project regression tests
        run: node --test tests/*.test.cjs
      - name: Calculate source-evidence progress
        run: node scripts/project-status.mjs
