name: VEYROST 3D prototype checks
on:
  push:
    branches:
      - feature/veyrost-3d-parallel
    paths-ignore:
      - "3d/assets/*.glb"
      - "3d/assets/*.glb.gz"
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic GLB models
        run: python3 3d/tools/generate_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check 3D modules
        run: |
          node --check 3d/src/main.js
          node --check 3d/src/scene.js
          node --check 3d/src/sequence-contract.mjs
          node --check 3d/src/ik.mjs
      - name: Test deterministic sequence and GLB structure
        run: node --test tests/veyrost-3d-*.test.mjs
      - name: Verify parallel scene entry points
        run: |
          test -f 3d/index.html
          grep -q 'src/main.js' 3d/index.html
          grep -q 'service-vehicle.glb' 3d/src/scene.js
          grep -q 'robot-technician.glb' 3d/src/scene.js
          grep -q 'robot-assistant.glb' 3d/src/scene.js
      - name: Commit generated GLB files to the feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/assets/*.glb 3d/assets/*.glb.gz
          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
          else
            git commit -m "build(3d): generate rigged GLB model assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
