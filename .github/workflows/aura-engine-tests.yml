name: AURA engine checks

on:
  push:
    branches:
      - 'feat/*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AURA engine syntax
        run: node --check aura-engine.mjs
      - name: Check AURA lab module syntax
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("aura-lab.html","utf8"); const match=html.match(/<script type="module">([\s\S]*?)<\/script>/i); if(!match) throw new Error("AURA lab module not found"); fs.writeFileSync("/tmp/aura-lab.mjs",match[1]);'
          node --check /tmp/aura-lab.mjs
      - name: Check shared website modules
        run: |
          cp assets/veyrost-site.js /tmp/veyrost-site.mjs
          cp assets/projects-data.js /tmp/veyrost-projects.mjs
          node --check /tmp/veyrost-site.mjs
          node --check /tmp/veyrost-projects.mjs
          node -e 'const fs=require("node:fs"); for (const file of ["projects.html","studio.html"]) { const html=fs.readFileSync(file,"utf8"); const scripts=[...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/gi)]; scripts.forEach((match,index)=>fs.writeFileSync("/tmp/"+file.replace(".html","")+"-"+index+".mjs",match[1])); }'
          for file in /tmp/projects-*.mjs /tmp/studio-*.mjs; do [ -f "$file" ] && node --check "$file"; done
      - name: Check 3D spatial engine syntax
        run: |
          node --check spatial-math.mjs
          node --check spatial-world.mjs
      - name: Run project regression tests
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Calculate source-evidence progress
        run: node scripts/project-status.mjs
